name: Build e upload su MEGA

# Compila l'app come singolo .exe autonomo (nessun .NET da installare sul PC
# di destinazione) e lo pubblica su MEGA, cancellando prima quello vecchio.
# Il nome del file resta sempre lo stesso, così il link di condivisione MEGA
# non cambia mai — è proprio per questo che si cancella invece di sovrascrivere:
# MEGA altrimenti terrebbe la vecchia copia come versione precedente.

on:
  push:
    branches: [master]
    # Un tag v* pubblica anche la Release su GitHub, con l'.exe allegato dal
    # runner: il binario non passa mai dalla connessione di casa.
    tags: ['v*']
  # La pagina "New release" di GitHub crea il tag da sé. A seconda di come lo
  # fa, l'evento push sul tag può non arrivare: questo trigger copre quel caso.
  release:
    types: [published]
  workflow_dispatch:

# Nessun filtro sui path: con 'paths-ignore' attivo un push di solo tag non
# porta commit, quindi il filtro lo scarterebbe e la release non partirebbe.

# Due push ravvicinati non devono toccare MEGA insieme: il secondo aspetta.
concurrency:
  group: mega-upload
  cancel-in-progress: false

env:
  PROJECT: EldoradoApp/EldoradoApp.csproj
  # Nome con cui il file arriva su MEGA. Cambialo con la variabile di
  # repository MEGA_FILE_NAME (Settings -> Secrets and variables -> Variables).
  ARTIFACT_NAME: EldoradoBot.exe

jobs:
  build:
    name: Compila (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Ricava la versione dal tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Solo i build da tag hanno un numero di versione: v1.2.3 -> 1.2.3.
          # Sui push di master resta il default 1.0.0.0.
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish single-file self-contained
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Le stesse opzioni del build a mano: un solo .exe da ~69 MB, con le
          # librerie native estratte a runtime e compresso (senza compressione
          # sarebbero ~154 MB). Niente PDB: non serve a chi lo esegue.
          $props = @(
            '-c', 'Release',
            '-r', 'win-x64',
            '--self-contained', 'true',
            '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:EnableCompressionInSingleFile=true',
            '-p:DebugType=none',
            '-p:DebugSymbols=false',
            '-o', 'publish'
          )

          # Così le proprietà del file corrispondono al tag della release.
          if ($env:APP_VERSION) {
            $props += "-p:Version=$env:APP_VERSION"
            Write-Host "Versione: $env:APP_VERSION"
          }

          dotnet publish $env:PROJECT @props

      - name: Rinomina e controlla il risultato
        shell: pwsh
        run: |
          $exe = Join-Path 'publish' 'EldoradoApp.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem publish
            throw "EldoradoApp.exe non prodotto dal publish."
          }

          $out = Join-Path 'publish' '${{ env.ARTIFACT_NAME }}'
          Move-Item $exe $out -Force

          $size = (Get-Item $out).Length
          Write-Host "$($out): $([math]::Round($size / 1MB, 1)) MB"

          # Un single-file self-contained sta sulle decine di MB. Molto meno
          # significa che il publish è uscito framework-dependent e sul PC di
          # destinazione non partirebbe.
          if ($size -lt 20MB) {
            throw "Eseguibile troppo piccolo ($size byte): non è self-contained."
          }

      - name: Carica l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: eldorado-bot-exe
          path: publish/${{ env.ARTIFACT_NAME }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Allega l'exe alla Release GitHub
    needs: build
    # Solo per i tag: un push su master non deve creare release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Scarica l'artifact
        uses: actions/download-artifact@v4
        with:
          name: eldorado-bot-exe
          path: dist

      - name: Crea la release (o aggiornala) con l'exe allegato
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          exe="$(find dist -maxdepth 1 -type f -name '*.exe' | head -n1)"
          [ -n "$exe" ] || { echo "::error::artifact mancante"; exit 1; }

          # Se la release esiste già — creata a mano dalla pagina "New release"
          # di GitHub — non va ricreata: le si allega soltanto il binario.
          # --clobber sostituisce un allegato con lo stesso nome.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME già presente: allego il binario."
            gh release upload "$GITHUB_REF_NAME" "$exe" --clobber
          else
            echo "Creo la release $GITHUB_REF_NAME."
            gh release create "$GITHUB_REF_NAME" "$exe" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

          gh release view "$GITHUB_REF_NAME" --json name,tagName,assets \
            --jq '"\(.tagName) — allegati: \(.assets | map(.name) | join(", "))"'

  upload:
    name: Pubblica su MEGA
    needs: build
    # Versione fissata: l'URL del pacchetto MEGAcmd contiene la release di
    # Ubuntu, quindi 'ubuntu-latest' si romperebbe da solo al prossimo giro.
    runs-on: ubuntu-24.04

    steps:
      - name: Scarica l'artifact
        uses: actions/download-artifact@v4
        with:
          name: eldorado-bot-exe
          path: dist

      - name: Installa MEGAcmd
        run: |
          set -euo pipefail
          url="https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb"
          curl -fsSL -o megacmd.deb "$url"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ./megacmd.deb
          mega-version

      - name: Login, sostituzione, logout
        env:
          MEGA_SESSION: ${{ secrets.MEGA_SESSION }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          REMOTE_DIR: ${{ vars.MEGA_REMOTE_DIR || '/EldoradoBot' }}
          FILE_NAME: ${{ vars.MEGA_FILE_NAME || 'EldoradoBot.exe' }}
        run: |
          # Niente 'set -x' qui dentro: traccerebbe le credenziali nel log.
          set -euo pipefail

          # Qualunque sia il nome locale, l'artifact contiene un solo .exe.
          local_file="$(find dist -maxdepth 1 -type f -name '*.exe' | head -n1)"
          [ -n "$local_file" ] || { echo "::error::artifact mancante"; exit 1; }

          remote_path="${REMOTE_DIR%/}/${FILE_NAME}"

          # Un secret incollato dall'output di 'mega-session' si porta dietro
          # l'etichetta o un a capo, e MEGA lo rifiuterebbe come sessione non
          # valida: si tiene solo il token.
          session="${MEGA_SESSION:-}"
          session="${session##*: }"
          session="$(printf '%s' "$session" | tr -d '[:space:]')"

          # Il logout finale deve partire anche se qualcosa fallisce a metà,
          # altrimenti la sessione resta aperta lato MEGA. Ma 'mega-logout' senza
          # flag la sessione la CHIUDE per davvero: con il login da sessione
          # salvata bruciava il secret al primo giro, e dal secondo in poi il
          # login falliva con "Bad session ID". Con --keep-session la sessione
          # resta riutilizzabile; solo il login con email e password, che una
          # sessione la crea sul momento, va chiuso davvero.
          keep_session=1
          cleanup() {
            if [ "$keep_session" = 1 ]; then
              mega-logout --keep-session >/dev/null 2>&1 || true
            else
              mega-logout >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          login_con_password() {
            [ -n "${MEGA_EMAIL:-}" ] && [ -n "${MEGA_PASSWORD:-}" ] || return 1
            keep_session=0
            echo "Login con email e password."
            mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD" >/dev/null
          }

          if [ -n "$session" ]; then
            echo "Login con sessione salvata."
            if ! mega-login "$session" >/dev/null 2>login.err; then
              # Il motivo vero (scaduta, revocata, rete), senza ristampare il
              # token se un domani MEGA lo ripetesse dentro l'errore.
              grep -vF "$session" login.err | sed 's/^/  /' || true
              echo "La sessione salvata non e' piu' valida."
              if ! login_con_password; then
                echo "::error::MEGA_SESSION non e' piu' valido. Rigeneralo: 'mega-login EMAIL PASSWORD' (con --auth-code=XXXXXX se hai la 2FA), 'mega-session' per leggerlo, 'mega-logout --keep-session' per non chiuderlo. Oppure imposta i secret MEGA_EMAIL e MEGA_PASSWORD, che non scadono."
                exit 1
              fi
            fi
          elif ! login_con_password; then
            echo "::error::Servono i secret MEGA_SESSION oppure MEGA_EMAIL + MEGA_PASSWORD."
            exit 1
          fi

          mega-mkdir -p "$REMOTE_DIR" 2>/dev/null || true

          # Cancella la versione precedente solo se c'è davvero: 'mega-rm' su un
          # percorso inesistente esce con errore e fermerebbe il workflow.
          if mega-ls "$remote_path" >/dev/null 2>&1; then
            echo "Rimuovo la versione precedente: $remote_path"
            mega-rm -f "$remote_path"
          else
            echo "Nessuna versione precedente da rimuovere."
          fi

          echo "Carico $(du -h "$local_file" | cut -f1) su $remote_path"
          mega-put "$local_file" "$remote_path"

          # Conferma che sia arrivato, e con che dimensione.
          echo "--- contenuto di $REMOTE_DIR ---"
          mega-ls -l "$REMOTE_DIR"

      - name: Riepilogo
        if: success()
        env:
          REMOTE_DIR: ${{ vars.MEGA_REMOTE_DIR || '/EldoradoBot' }}
          FILE_NAME: ${{ vars.MEGA_FILE_NAME || 'EldoradoBot.exe' }}
        run: |
          {
            echo "### Build pubblicata"
            echo ""
            echo "- File: ${REMOTE_DIR%/}/${FILE_NAME}"
            echo "- Commit: ${GITHUB_SHA:0:7}"
            echo ""
            echo "Il link di condivisione MEGA non cambia: punta sempre a questo percorso."
          } >> "$GITHUB_STEP_SUMMARY"
